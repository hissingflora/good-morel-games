<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Morel Games</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10251d;
      color: #c9e3d5;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      text-align: center;
      padding: 40px 24px;
    }

    .morel {
      width: 42px;
      height: 58px;
      margin: 0 auto 24px;
      position: relative;
    }

    .cap {
      position: absolute;
      left: 5px;
      top: 2px;
      width: 32px;
      height: 40px;
      background: #c9e3d5;
      clip-path: polygon(
        50% 0,
        72% 12%,
        60% 25%,
        76% 38%,
        60% 51%,
        75% 65%,
        58% 80%,
        50% 100%,
        42% 80%,
        25% 65%,
        40% 51%,
        24% 38%,
        40% 25%,
        28% 12%
      );
    }

    .stem {
      position: absolute;
      left: 15px;
      top: 38px;
      width: 13px;
      height: 18px;
      background: #c9e3d5;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    p {
      margin: 18px 0 0;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      opacity: 0.65;
    }

    footer {
      position: fixed;
      bottom: 18px;
      width: 100%;
      text-align: center;
      font-size: 0.65rem;
      opacity: 0.35;
    }
  </style>
</head>

<body>

  <main>
    <div class="morel" aria-hidden="true">
      <div class="cap"></div>
      <div class="stem"></div>
    </div>

    <h1>GOOD MOREL GAMES</h1>

    <p>INDEPENDENT GAME STUDIO</p>
  </main>

  <footer>© 2026 GOOD MOREL GAMES</footer>

</body>
</html>
