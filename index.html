<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Morel Games</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f1e8;
      color: #2d2a24;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      text-align: center;
      padding: 40px 24px;
    }

    .mushroom {
      width: 64px;
      height: 64px;
      margin: 0 auto 28px;
      position: relative;
    }

    .cap {
      position: absolute;
      left: 7px;
      top: 5px;
      width: 50px;
      height: 36px;
      border: 2px solid #2d2a24;
      border-radius: 50% 50% 42% 42%;
      background: #d8c8a9;
    }

    .stem {
      position: absolute;
      left: 24px;
      top: 34px;
      width: 16px;
      height: 25px;
      border: 2px solid #2d2a24;
      border-top: 0;
      border-radius: 0 0 8px 8px;
      background: #f5f1e8;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      font-weight: normal;
      letter-spacing: 0.06em;
      line-height: 0.95;
    }

    p {
      margin: 22px 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      opacity: 0.4;
    }
  </style>
</head>

<body>
  <main>
    <div class="mushroom" aria-hidden="true">
      <div class="cap"></div>
      <div class="stem"></div>
    </div>

    <h1>Good Morel Games</h1>
    <p>Independent game studio.</p>
  </main>

  <footer>© 2026 Good Morel Games</footer>
</body>
</html>
